name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# For publishing, the repo owner must add an `NPM_TOKEN` secret (an npm automation
# token with publish rights to the @dudousxd scope).
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (packages)
        run: pnpm build

      - name: Typecheck
        run: pnpm -r --filter "./packages/*" typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

  # Runs on the SAME pipeline, after a green build — nothing publishes if CI fails.
