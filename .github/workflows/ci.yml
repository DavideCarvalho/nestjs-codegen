name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# For publishing, the repo owner must add an `NPM_TOKEN` secret (an npm automation
# token with publish rights to the @dudousxd scope).
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Build, typecheck, lint and package checks run once, on the Node the release is built with.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (packages)
        run: pnpm build

      - name: Check packages (publint + attw)
        run: pnpm check:package

      - name: Typecheck
        run: pnpm -r --filter "./packages/*" typecheck

      - name: Lint
        run: pnpm lint

  # Tests run on every Node major the packages support.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24.22.2, 26.13.0]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (packages)
        run: pnpm build

      - name: Test
        run: pnpm test
